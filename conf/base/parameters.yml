# Every column list, split proportion and hyperparameter lives here.
# Changing the model, the grid or the feature set never requires touching src/.

# Column groups, referenced by group key throughout the pipelines.
columns:
  target: Churn
  numerical:
    - tenure
    - MonthlyCharges
    - TotalCharges
  categorical:
    - PaymentMethod
    - Contract
    - gender
    - SeniorCitizen
    - Partner
    - Dependents
    - PhoneService
    - MultipleLines
    - InternetService
    - OnlineSecurity
    - OnlineBackup
    - DeviceProtection
    - TechSupport
    - StreamingTV
    - StreamingMovies
    - PaperlessBilling

split:
  train: 0.7
  test: 0.15
  validate: 0.15
  random_state: 42

# --- data engineering: fit on the train split only, to avoid leakage -------
modelling_encoders:
  columns: [target, categorical]
  split_to_fit: [train]

modelling_scalers:
  columns: [numerical]
  split_to_fit: [train]

# --- modelling -------------------------------------------------------------
modelling_baseline:
  class_path: sklearn.linear_model.LogisticRegression
  target_column: Churn
  train_splits: [train]
  eval_splits: [train, test, validate]

modelling_optimization:
  class_path: catboost.CatBoostClassifier
  target_column: Churn
  train_splits: [train, test]
  eval_splits: [train, test, validate]
  init_args:
    random_seed: 42
    verbose: 0
    train_dir: data/tmp/catboost_info
  cv: 5
  scoring: roc_auc
  param_grid:
    depth: [2, 4, 8]
    iterations: [10, 100, 300]
    learning_rate: [0.01, 0.05, 0.1]

# --- refit: same functions, every split, production artefacts --------------
refit_encoders:
  columns: [target, categorical]
  split_to_fit: [train, test, validate]

refit_scalers:
  columns: [numerical]
  split_to_fit: [train, test, validate]

refit_model:
  train_splits: [train, test, validate]
